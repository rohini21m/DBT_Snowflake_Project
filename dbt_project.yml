# dbt.project.yml file defines teh project structure and tables, views etc 
name: company_info
version: 1.0.0
flags:
  use_relation_cache: false 
config-version: 2
profile: company_info

# project component paths
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
# directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# seed tables route to the SEEDS schema
seeds:
  company_info:
    +schema: SEEDS
models:
  company_info:
    +persist_docs:
      relation: true
      columns: true
    STAGING:
      +materialized: view
      +schema: STAGING
    INTERMEDIATE:
      +materialized: view
      +schema: INTERMEDIATE
    MARTS:
      +materialized: table
      +schema: MARTS
